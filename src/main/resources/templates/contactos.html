<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Mis raices</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/estilos/productos.css}">
  <link rel="stylesheet" th:href="@{/estilos/contacto.css}">
</head>

<body>

<div th:replace="~{fragmentos :: nav-bar('contacto', ${cantidadTotal})}"></div>

<main class="container my-5">
  <h2 class="text-center mb-4">Contáctanos</h2>
  <div class="row justify-content-center">
    <div class="col-md-8">
      <p class="text-center mb-5">
        ¿Tienes alguna pregunta, comentario o necesitas ayuda? Rellena el siguiente formulario y nos pondremos en contacto contigo a la brevedad.
      </p>

      <form th:action="@{/contacto}" method="post" class="p-4 shadow-sm rounded contact-form">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="asunto" class="form-label">Asunto</label>
          <input type="text" class="form-control" id="asunto" name="asunto" required>
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea class="form-control" id="mensaje" name="mensaje" rows="5" required></textarea>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-vintage">Enviar mensaje</button>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="vintage-footer text-center py-3">
  <div class="social-icons mb-2">
    <a href="#" target="_blank"><i class="bi bi-facebook"></i></a>
    <a href="#" target="_blank"><i class="bi bi-instagram"></i></a>
    <a href="#" target="_blank"><i class="bi bi-whatsapp"></i></a>
    <a href="#" target="_blank"><i class="bi bi-geo-alt"></i></a>
  </div>
  <p>&copy; 2025 Mis raices | Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

</body>
</html>
