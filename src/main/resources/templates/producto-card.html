<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - Mis Raíces</title>
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css}" rel="stylesheet">
  <link th:href="@{https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap}" rel="stylesheet">
  <link th:href="@{/estilos/producto-card.css}" rel="stylesheet">
</head>

<body>

<th:block th:replace="~{fragmentos :: nav-bar('producto-card', ${cantidadTotal})}"></th:block>

<section class="container my-5 producto-detalle">
  <h2 class="text-center mb-4 producto-nombre" th:text="${producto.nombre}">Nombre del Producto</h2>

  <div class="row g-4">
    <div class="col-md-6 text-center">
      <div class="card-img-top-container">
        <div th:if="${producto.urlImagen != null and !producto.urlImagen.isEmpty()}">
          <img th:src="@{'/imagenes/productos/' + ${producto.urlImagen}}" class="img-fluid rounded shadow-sm" th:alt="${producto.nombre}">
        </div>
        <div th:if="${producto.urlImagen == null or producto.urlImagen.isEmpty()}" class="no-image-placeholder py-5">
          <i class="bi bi-image" style="font-size: 4rem; color: #c9b79c;"></i>
          <p class="text-muted mt-2">Imagen no disponible</p>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="producto-info p-4">
        <p class="descripcion" th:text="${producto.descripcion}">
          Detalles del producto y características importantes.
        </p>

        <h4 class="precio fw-bold text-vintage" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 0, 'POINT', 0, 'COMMA')}">$2.500</h4>

        <div class="medios-pago mb-3 d-flex align-items-center gap-2">
          <span class="fw-bold">Medios de pago:</span>
          <i class="bi bi-credit-card-fill"></i>
          <i class="bi bi-wallet2"></i>
          <i class="bi bi-paypal"></i>
        </div>

        <!-- Formulario para agregar al carrito -->
        <form th:action="@{/carrito/agregar}" method="post">
          <input type="hidden" name="id" th:value="${producto.id}">

          <div class="cantidad-agregar d-flex align-items-center gap-2 mb-3">
            <label for="cantidad" class="form-label mb-0 fw-bold">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" value="1" min="1" class="form-control w-25 text-center">
          </div>

          <button type="submit" class="btn btn-vintage w-100">Agregar al carrito</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="vintage-footer text-center py-3">
  <div class="social-icons mb-2">
    <a href="#"><i class="bi bi-facebook"></i></a>
    <a href="#"><i class="bi bi-instagram"></i></a>
    <a href="#"><i class="bi bi-whatsapp"></i></a>
    <a href="#"><i class="bi bi-geo-alt"></i></a>
  </div>
  <p>&copy; 2025 Mis raices | Todos los derechos reservados.</p>
</footer>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
