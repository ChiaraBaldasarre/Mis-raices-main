<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - Mis Raíces</title>

  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">

  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css}" rel="stylesheet">

  <link th:href="@{https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap}" rel="stylesheet">

  <link th:href="@{/estilos/producto-card.css}" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragmentos :: nav-bar('producto-card', ${cantidadTotal})}"></div>

<section class="container my-5 producto-detalle">
  <h2 class="text-center mb-4 producto-nombre">Nombre del Producto</h2>
  <div class="row g-4">
    <div class="col-md-6">
      <div id="carouselProducto" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img th:src="@{/imagenes/producto1.jpg}" class="d-block w-100" alt="Imagen 1">
          </div>
          <div class="carousel-item">
            <img th:src="@{/imagenes/producto2.jpg}" class="d-block w-100" alt="Imagen 2">
          </div>
          <div class="carousel-item">
            <img th:src="@{/imagenes/producto3.jpg}" class="d-block w-100" alt="Imagen 3">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselProducto" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselProducto" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <div class="col-md-6">
      <div class="producto-info p-4">
        <p class="descripcion">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Fusce at velit vitae ligula volutpat efficitur.
          Detalles del producto y características importantes.
        </p>
        <h4 class="precio">$2.500</h4>

        <div class="medios-pago mb-3 d-flex align-items-center gap-2"> <span class="fw-bold">Medios de pago:</span>
          <i class="bi bi-credit-card-fill"></i>
          <i class="bi bi-wallet2"></i>
          <i class="bi bi-paypal"></i>
        </div>

        <div class="cantidad-agregar d-flex align-items-center gap-2 mb-3">
          <button class="btn-quantity">-</button>
          <span class="quantity">1</span>
          <button class="btn-quantity">+</button>
        </div>
        <button class="btn btn-vintage w-100">Agregar al carrito</button>
      </div>
    </div>
  </div>
</section>

<footer class="vintage-footer text-center py-3">
  <div class="social-icons mb-2">
    <a href="#"><i class="bi bi-facebook"></i></a>
    <a href="#"><i class="bi bi-instagram"></i></a>
    <a href="#"><i class="bi bi-whatsapp"></i></a>
    <a href="#"><i class="bi bi-geo-alt"></i></a>
  </div>
  <p>&copy; 2025 Mis raices | Todos los derechos reservados.</p>
</footer>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
