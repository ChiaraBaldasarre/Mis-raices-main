<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- Fragmento de navbar -->
<div th:fragment="nav-bar(paginaActual, cantidadTotal)">
    <nav class="navbar navbar-expand-lg vintage-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Mis raices</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse d-flex" id="navbarNav">
                <ul class="navbar-nav ms-auto me-3">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActual == 'inicio'} ? 'active'" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActual == 'productos'} ? 'active'" th:href="@{/productos}">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActual == 'contacto'} ? 'active'" th:href="@{/contacto}">Contacto</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActual == 'nosotros'} ? 'active'" th:href="@{/nosotros}">Nosotros</a>
                    </li>
                    <li class="nav-item" th:if="${usuarioActual == null}">
                        <a class="nav-link" th:classappend="${paginaActual == 'registro'} ? 'active'" th:href="@{/registro}">Registro</a>
                    </li>
                    <li class="nav-item" th:if="${usuarioActual == null}">
                        <a class="nav-link" th:classappend="${paginaActual == 'login'} ? 'active'" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item" th:if="${usuarioActual != null}">
                        <a class="nav-link" th:href="@{/logout}">Cerrar Sesión</a>
                    </li>
                </ul>

                <a th:href="@{/carrito}" class="btn btn-vintage position-relative" th:if="${usuarioActual != null}">
                    <i class="bi bi-cart-fill"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          th:text="${cantidadTotal}">0</span>
                </a>
            </div>
        </div>
    </nav>
</div>

<!-- Fragmento de footer -->
<div th:fragment="footer">
    <footer class="vintage-footer">
        <div class="social-icons">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-twitter"></i></a>
        </div>
        <p>&copy; 2023 Mis Raíces. Todos los derechos reservados.</p>
    </footer>
</div>
</body>
</html>
