<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mis Raíces</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* =====================
           ESTILOS GENERALES
        ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #fdf6ec;
            color: #4a3f35;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =====================
           CONTENEDOR DEL FORMULARIO
        ===================== */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-color: #fdf6ec;
        }

        .form-card {
            background: #fffaf3;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #e8d9c3;
            width: 100%;
            max-width: 500px;
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #4a3f35;
            font-weight: 600;
            font-size: 1.8rem;
            font-family: 'Playfair Display', serif;
        }

        .form-label {
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 8px;
        }

        .form-control {
            border: 2px solid #c9b79c;
            border-radius: 6px;
            padding: 12px;
            background: #fff;
            transition: all 0.3s ease;
            color: #4a3f35;
        }

        .form-control:focus {
            border-color: #a67c52;
            box-shadow: 0 0 8px rgba(166, 124, 82, 0.3);
            background: #fff;
            outline: none;
        }

        /* Botón estilo vintage */
        .btn-vintage {
            background-color: #a67c52;
            border: none;
            color: #FFF8E7;
            font-weight: 600;
            padding: 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-vintage:hover {
            background-color: #8c6239;
            transform: scale(1.02);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #4a3f35;
            font-size: 1rem;
        }

        .register-link a {
            color: #a67c52;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
            color: #8c6239;
        }

        /* =====================
           ALERTAS Y VALIDACIONES
        ===================== */
        .alert {
            border-radius: 6px;
            border: 1px solid;
            margin-bottom: 20px;
        }

        .alert-success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .alert-danger {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        /* =====================
           FOOTER
        ===================== */
        .vintage-footer {
            background-color: #c9b79c;
            color: #4a3f35;
            text-align: center;
            padding: 20px 15px;
            font-family: 'Poppins', sans-serif;
            margin-top: auto;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .vintage-footer .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .vintage-footer .social-icons a {
            color: #4a3f35;
            font-size: 1.6rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .vintage-footer .social-icons a:hover {
            color: #7a5c3e;
            transform: scale(1.2);
        }

        .vintage-footer p {
            font-size: 0.85rem;
            margin: 0;
            opacity: 0.9;
        }

        /* Estilo para el logo en la página de login */
        .login-logo {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 20px;
        }

        .login-logo a {
            font-family: 'Georgia', serif;
            font-weight: 700;
            font-size: 2.2rem;
            color: #4a3f35;
            text-shadow: 1px 3px 2px #67584a, 3px 13px 5px #7a6959;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .login-logo a:hover {
            font-weight: 1000;
        }
    </style>
</head>
<body>
<!-- Logo de la marca sin navbar -->
<div class="login-logo">
    <a th:href="@{/}">Mis raices</a>
</div>

<!-- Contenido Principal -->
<div class="login-container">
    <div class="form-card">
        <h2>Iniciar Sesión</h2>

        <!-- Mensaje de error de Spring Security -->
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Nombre de usuario o contraseña inválidos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            Sesión cerrada correctamente.
        </div>

        <div th:if="${registroExitoso}" class="alert alert-success" role="alert">
            <span th:text="${registroExitoso}"></span>
        </div>

        <!-- ELIMINAR ESTA ALERTA DUPLICADA -->
        <!-- <div th:if="${param.registroExitoso}" class="alert alert-success" role="alert">
            <span th:text="${param.registroExitoso}"></span>
        </div> -->

        <form th:action="@{/login}" method="post">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-vintage">Acceder</button>
        </form>

        <div class="register-link">
            ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="vintage-footer text-center py-3">
    <div class="social-icons mb-2">
        <a href="#" target="_blank"><i class="bi bi-facebook"></i></a>
        <a href="#" target="_blank"><i class="bi bi-instagram"></i></a>
        <a href="#" target="_blank"><i class="bi bi-whatsapp"></i></a>
        <a href="#" target="_blank"><i class="bi bi-geo-alt"></i></a>
    </div>
    <p>&copy; 2025 Mis raices | Todos los derechos reservados.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
