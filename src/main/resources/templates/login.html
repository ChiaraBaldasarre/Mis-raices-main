<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mis Raíces</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Tu CSS externo -->
    <link rel="stylesheet" th:href="@{/estilos/login-registro.css}">
</head>
<body class="login-body">

<div class="form-card">
    <h2>Iniciar Sesión</h2>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        Nombre de usuario o contraseña inválidos.
    </div>

    <div th:if="${param.logout}" class="alert alert-success" role="alert">
        Sesión cerrada correctamente.
    </div>

    <div th:if="${registroExitoso}" class="alert alert-success" role="alert">
        <span th:text="${registroExitoso}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3 text-start">
            <label for="username" class="form-label">Nombre de Usuario</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3 text-start">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-vintage">Acceder</button>
    </form>

    <div class="mt-3">
        <span>¿No tienes cuenta? </span>
        <a th:href="@{/registro}">Regístrate aquí</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
