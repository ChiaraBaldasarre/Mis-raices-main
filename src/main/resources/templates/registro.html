<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Mis Raíces</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Georgia&display=swap" rel="stylesheet">

    <style>
        /* =====================
           ESTILOS GENERALES
        ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #fdf6ec;
            color: #4a3f35;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =====================
           LOGO EN PÁGINA DE REGISTRO
        ===================== */
        .registro-logo {
            text-align: center;
            padding: 20px 0;
            background-color: #fdf6ec;
        }

        .registro-logo a {
            font-family: 'Georgia', serif;
            font-weight: 700;
            font-size: 2.5rem;
            color: #4a3f35;
            text-shadow: 1px 3px 2px #67584a, 3px 13px 5px #7a6959;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .registro-logo a:hover {
            font-weight: 1000;
            text-decoration: none;
        }

        /* =====================
           CONTENEDOR DEL FORMULARIO
        ===================== */
        .registro-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fdf6ec;
        }

        .form-card {
            background: #fffaf3;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #e8d9c3;
            width: 100%;
            max-width: 500px;
            margin-top: 0;
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #4a3f35;
            font-weight: 600;
            font-size: 1.8rem;
            font-family: 'Georgia', serif;
        }

        .form-label {
            font-weight: 600;
            color: #4a3f35;
            margin-bottom: 8px;
        }

        .form-control {
            border: 2px solid #c9b79c;
            border-radius: 6px;
            padding: 12px;
            background: #fff;
            transition: all 0.3s ease;
            color: #4a3f35;
        }

        .form-control:focus {
            border-color: #a67c52;
            box-shadow: 0 0 8px rgba(166, 124, 82, 0.3);
            background: #fff;
            outline: none;
        }

        .form-text {
            font-size: 0.85rem;
            color: #8c6239;
            margin-top: 5px;
            font-style: italic;
        }

        /* Botón estilo vintage */
        .btn-vintage {
            background-color: #a67c52;
            border: none;
            color: #FFF8E7;
            font-weight: 600;
            padding: 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-vintage:hover {
            background-color: #8c6239;
            transform: scale(1.02);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #4a3f35;
            font-size: 1rem;
        }

        .login-link a {
            color: #a67c52;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
            color: #8c6239;
        }

        /* =====================
           ALERTAS Y VALIDACIONES
        ===================== */
        .alert {
            border-radius: 6px;
            border: 1px solid;
            margin-bottom: 20px;
        }

        .alert-success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .alert-danger {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .is-valid {
            border-color: #28a745 !important;
        }

        .is-invalid {
            border-color: #dc3545 !important;
            background-color: #fff5f5 !important;
        }

        .text-danger {
            color: #dc3545 !important;
            font-size: 0.875rem;
            margin-top: 5px;
        }

        /* =====================
           FOOTER ESTILOS
        ===================== */
        .vintage-footer {
            background-color: #c9b79c;
            color: #4a3f35;
            text-align: center;
            padding: 20px 15px;
            font-family: 'Poppins', sans-serif;
            margin-top: auto;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .vintage-footer .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .vintage-footer .social-icons a {
            color: #4a3f35;
            font-size: 1.6rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .vintage-footer .social-icons a:hover {
            color: #7a5c3e;
            transform: scale(1.2);
        }

        .vintage-footer p {
            font-size: 0.85rem;
            margin: 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
<!-- Logo sin navbar -->
<div class="registro-logo">
    <a th:href="@{/}">Mis raices</a>
</div>

<div class="registro-container">
    <div class="form-card">
        <h2>Crear Cuenta</h2>

        <!-- Mensajes de éxito -->
        <div th:if="${param.registroExitoso}" class="alert alert-success" role="alert">
            ¡Registro exitoso! Ahora puedes iniciar sesión.
        </div>

        <!-- Mensajes de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${usernameError}" class="alert alert-danger" role="alert">
            <span th:text="${usernameError}"></span>
        </div>

        <div th:if="${emailError}" class="alert alert-danger" role="alert">
            <span th:text="${emailError}"></span>
        </div>

        <div th:if="${passwordError}" class="alert alert-danger" role="alert">
            <span th:text="${passwordError}"></span>
        </div>

        <form th:action="@{/registro}" method="post" th:object="${usuario}">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="username" name="username" th:field="*{username}"
                       th:classappend="${usernameError != null ? 'is-invalid' : ''}" required>
                <div th:if="${usernameError}" class="text-danger" th:text="${usernameError}"></div>
            </div>
            <div class="mb-3 text-start">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" th:field="*{email}"
                       th:classappend="${emailError != null ? 'is-invalid' : ''}" required>
                <div th:if="${emailError}" class="text-danger" th:text="${emailError}"></div>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" th:field="*{password}"
                       th:classappend="${passwordError != null ? 'is-invalid' : ''}" required>
                <div th:if="${passwordError}" class="text-danger" th:text="${passwordError}"></div>
                <div class="form-text">La contraseña debe tener al menos 6 caracteres</div>
            </div>
            <button type="submit" class="btn btn-vintage">Crear Cuenta</button>
        </form>

        <div class="login-link">
            ¿Ya tienes cuenta? <a th:href="@{/login}" href="/login">Inicia sesión aquí</a>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="vintage-footer">
    <div class="social-icons">
        <a href="#"><i class="bi bi-facebook"></i></a>
        <a href="#"><i class="bi bi-instagram"></i></a>
        <a href="#"><i class="bi bi-twitter"></i></a>
    </div>
    <p>&copy; 2023 Mis Raíces. Todos los derechos reservados.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Validación visual de contraseña
    const passwordField = document.getElementById('password');

    passwordField.addEventListener('input', function() {
        const password = this.value;

        if (password.length === 0) {
            this.classList.remove('is-valid', 'is-invalid');
        } else if (password.length >= 6) {
            this.classList.add('is-valid');
            this.classList.remove('is-invalid');
        } else {
            this.classList.add('is-invalid');
            this.classList.remove('is-valid');
        }
    });
</script>
</body>
</html>
