<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Mis Raíces</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Tu CSS externo -->
    <link rel="stylesheet" th:href="@{/estilos/login-registro.css}">
</head>
<body class="login-body">

<div class="form-card">
    <h2>Crear Cuenta</h2>

    <div th:if="${param.registroExitoso}" class="alert alert-success" role="alert">
        ¡Registro exitoso! Ahora puedes iniciar sesión.
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${usernameError}" class="alert alert-danger" role="alert">
        <span th:text="${usernameError}"></span>
    </div>

    <div th:if="${emailError}" class="alert alert-danger" role="alert">
        <span th:text="${emailError}"></span>
    </div>

    <div th:if="${passwordError}" class="alert alert-danger" role="alert">
        <span th:text="${passwordError}"></span>
    </div>

    <form th:action="@{/registro}" method="post" th:object="${usuario}">
        <div class="mb-3 text-start">
            <label for="username" class="form-label">Nombre de Usuario</label>
            <input type="text" class="form-control" id="username" name="username" th:field="*{username}"
                   th:classappend="${usernameError != null ? 'is-invalid' : ''}" required>
            <div th:if="${usernameError}" class="text-danger" th:text="${usernameError}"></div>
        </div>

        <div class="mb-3 text-start">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" th:field="*{email}"
                   th:classappend="${emailError != null ? 'is-invalid' : ''}" required>
            <div th:if="${emailError}" class="text-danger" th:text="${emailError}"></div>
        </div>

        <div class="mb-3 text-start">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" th:field="*{password}"
                   th:classappend="${passwordError != null ? 'is-invalid' : ''}" required>
            <div th:if="${passwordError}" class="text-danger" th:text="${passwordError}"></div>
            <div class="form-text" style="font-size: 0.85rem; color: #8c6239; margin-top: 5px; font-style: italic;">La contraseña debe tener al menos 6 caracteres</div>
        </div>

        <button type="submit" class="btn btn-vintage">Crear Cuenta</button>
    </form>

    <div class="mt-3">
        <span>¿Ya tienes cuenta? </span>
        <a th:href="@{/login}">Inicia sesión aquí</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const passwordField = document.getElementById('password');
    passwordField.addEventListener('input', function() {
        const password = this.value;
        if (password.length === 0) {
            this.classList.remove('is-valid', 'is-invalid');
        } else if (password.length >= 6) {
            this.classList.add('is-valid');
            this.classList.remove('is-invalid');
        } else {
            this.classList.add('is-invalid');
            this.classList.remove('is-valid');
        }
    });
</script>
</body>
</html>
