<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Mis raices</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/estilos/productos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>

<div th:replace="~{fragmentos :: nav-bar('productos', ${cantidadTotal})}"></div>

<main class="container my-5">
    <h2 class="text-center mb-5">Nuestros Productos</h2>

    <div class="row">
        <div class="col-lg-3 mb-4">
            <div class="filter-box">
                <h5 class="fw-bold">Filtrar por</h5>
                <form th:action="@{/productos}" method="get">

                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoría</label>
                        <select id="categoria" name="categoria" class="form-select">
                            <option value="Todas"
                                    th:selected="${categoriaSeleccionada == null or categoriaSeleccionada.isEmpty() or categoriaSeleccionada == 'Todas'}">
                                Todas
                            </option>
                            <option value="Hombres" th:selected="${categoriaSeleccionada == 'Hombres'}">Hombres</option>
                            <option value="Mujeres" th:selected="${categoriaSeleccionada == 'Mujeres'}">Mujeres</option>
                            <option value="Niños" th:selected="${categoriaSeleccionada == 'Niños'}">Niños</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="precioMax" class="form-label">Precio Máximo ($)</label>
                        <input type="range" class="form-range" id="precioMax" name="precioMax" min="0" max="5000" step="100"
                               th:value="${precioMaxSeleccionado != null ? precioMaxSeleccionado : 5000}">
                        <p><small>Máximo: $<span id="precioMaxValor"
                                                 th:text="${#numbers.formatDecimal(precioMaxSeleccionado != null ? precioMaxSeleccionado : 5000, 0, 'POINT', 0, 'COMMA')}">5.000</span></small></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Colores</label>
                        <div class="form-check" th:each="color : ${ {'Negro', 'Marrón', 'Rojo', 'Azul', 'Blanco'} }">
                            <input class="form-check-input" type="checkbox" name="color" th:value="${color}"
                                   th:id="${'color-' + color}"
                                   th:checked="${coloresSeleccionados != null and #lists.contains(coloresSeleccionados, color)}">
                            <label class="form-check-label" th:for="${'color-' + color}" th:text="${color}">Negro</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-vintage w-100 mt-3">Aplicar Filtros</button>
                </form>
            </div>
        </div>

        <div class="col-lg-9">
            <div class="row g-4">

                <!-- Mensaje cuando no hay productos -->
                <div th:if="${#lists.isEmpty(productos)}" class="col-12 text-center py-5">
                    <div class="empty-products">
                        <i class="bi bi-box-seam" style="font-size: 4rem; color: #c9b79c;"></i>
                        <h4 class="mt-3">No hay productos disponibles</h4>
                        <p class="text-muted">Próximamente agregaremos nuevos productos a nuestro catálogo.</p>
                        <a th:href="@{/}" class="btn btn-vintage mt-2">Volver al Inicio</a>
                    </div>
                </div>

                <!-- Productos de la base de datos -->
                <div class="col-md-6 col-lg-4" th:each="producto : ${productos}">
                    <div class="card product-card h-100">
                        <div class="card-img-top-container">
                            <!-- Solo muestra imagen si existe en la base de datos -->
                            <div th:if="${producto.urlImagen != null and !producto.urlImagen.isEmpty()}">
                                <img th:src="@{${producto.urlImagen}}" class="card-img-top" th:alt="${producto.nombre}">
                            </div>
                            <div th:if="${producto.urlImagen == null or producto.urlImagen.isEmpty()}" class="no-image-placeholder">
                                <i class="bi bi-image" style="font-size: 3rem; color: #c9b79c;"></i>
                                <p class="text-muted mt-2">Imagen no disponible</p>
                            </div>
                        </div>
                        <div class="card-body text-center d-flex flex-column justify-content-between">
                            <h5 class="card-title" th:text="${producto.nombre}">Nombre del Producto</h5>
                            <p class="card-text fw-bold text-vintage" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 0, 'POINT', 0, 'COMMA')}">$1.500</p>
                        </div>
                        <div class="card-footer text-center border-0 bg-transparent">
                            <form th:action="@{/carrito/agregar}" method="post" class="d-inline">
                                <input type="hidden" name="id" th:value="${producto.id}">
                                <button type="submit" class="btn btn-vintage w-100">Agregar al carrito</button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<footer class="vintage-footer text-center py-3">
    <div class="social-icons mb-2">
        <a href="#" target="_blank"><i class="bi bi-facebook"></i></a>
        <a href="#" target="_blank"><i class="bi bi-instagram"></i></a>
        <a href="#" target="_blank"><i class="bi bi-whatsapp"></i></a>
        <a href="#" target="_blank"><i class="bi bi-geo-alt"></i></a>
    </div>
    <p>&copy; 2025 Mis raices | Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const rangeInput = document.getElementById('precioMax');
    const valorDisplay = document.getElementById('precioMaxValor');

    // Inicializar con el valor de Thymeleaf
    document.addEventListener('DOMContentLoaded', () => {
        const initialValue = rangeInput.value;
        valorDisplay.textContent = new Intl.NumberFormat('es-AR').format(initialValue);
    });

    // Actualizar en tiempo real
    rangeInput.addEventListener('input', function() {
        valorDisplay.textContent = new Intl.NumberFormat('es-AR').format(this.value);
    });
</script>

</body>
</html>
