<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Mis Raices</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link th:href="@{/estilos/carrito.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragmentos :: nav-bar('carrito', ${cantidadTotal})}"></div>

<section class="container my-5 carrito">
  <h2 class="text-center mb-4">Mi Carrito</h2>

  <div th:if="${#lists.isEmpty(itemsCarrito)}" class="text-center">
    <div class="empty-cart">
      <i class="bi bi-cart-x" style="font-size: 4rem; color: #8B4513;"></i>
      <h4 class="mt-3">Tu carrito está vacío</h4>
      <p class="text-muted">Agrega algunos productos para comenzar tu compra</p>
      <a th:href="@{/productos}" class="btn btn-vintage">Ver Productos</a>
    </div>
  </div>

  <div th:each="item : ${itemsCarrito}" class="cart-item d-flex align-items-center justify-content-between p-3 mb-3 border rounded shadow-sm">
    <div class="d-flex align-items-center gap-3">
      <img th:src="@{'/imagenes/productos/' + ${item.producto.urlImagen}}" alt="Producto" class="cart-img">
      <div>
        <h5 class="mb-1" th:text="${item.producto.nombre}">Producto</h5>
        <p class="mb-0" th:text="'$' + ${#numbers.formatDecimal(item.producto.precio, 0, 'POINT', 0, 'COMMA')}">$1.500</p>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <form th:action="@{/carrito/actualizar}" method="post" class="d-inline">
        <input type="hidden" name="id" th:value="${item.producto.id}">
        <input type="hidden" name="cantidad" th:value="${item.cantidad - 1}">
        <button type="submit" class="btn btn-quantity" th:disabled="${item.cantidad <= 1}">-</button>
      </form>
      <span class="quantity" th:text="${item.cantidad}">1</span>
      <form th:action="@{/carrito/actualizar}" method="post" class="d-inline">
        <input type="hidden" name="id" th:value="${item.producto.id}">
        <input type="hidden" name="cantidad" th:value="${item.cantidad + 1}">
        <button type="submit" class="btn btn-quantity">+</button>
      </form>
      <form th:action="@{/carrito/eliminar}" method="post" class="d-inline ms-3">
        <input type="hidden" name="id" th:value="${item.producto.id}">
        <button type="submit" class="btn btn-delete"><i class="bi bi-trash-fill"></i></button>
      </form>
    </div>
  </div>

  <hr class="my-4">
  <div class="d-flex justify-content-end mb-4">
    <div class="col-md-4">
      <div class="d-flex justify-content-between align-items-center">
        <h5>Total:</h5>
        <h5 class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(totalCarrito, 0, 'POINT', 0, 'COMMA')}">$0</h5>
      </div>
    </div>
  </div>

  <!-- Mensajes de error -->
  <div th:if="${error}" class="alert alert-danger text-center" role="alert">
    <span th:text="${error}"></span>
  </div>

  <!-- Formulario de checkout -->
  <div th:if="${!#lists.isEmpty(itemsCarrito)}" class="checkout-section">
    <h4 class="mb-3">Información de Entrega</h4>
    <form th:action="@{/carrito/checkout}" method="post" class="row justify-content-center">
      <div class="col-md-6">
        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección de entrega</label>
          <input type="text" class="form-control" id="direccion" name="direccion"
                 placeholder="Ingresa tu dirección completa" required>
        </div>
        <div class="mb-3">
          <label for="contacto" class="form-label">Número de contacto</label>
          <input type="tel" class="form-control" id="contacto" name="contacto"
                 placeholder="Tu número de teléfono" required>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-vintage btn-lg">Procesar Pedido</button>
        </div>
      </div>
    </form>
  </div>
</section>

<footer class="vintage-footer text-center py-3">
  <div class="social-icons mb-2">
    <a href="#"><i class="bi bi-facebook"></i></a>
    <a href="#"><i class="bi bi-instagram"></i></a>
    <a href="#"><i class="bi bi-whatsapp"></i></a>
    <a href="#"><i class="bi bi-geo-alt"></i></a>
  </div>
  <p>&copy; 2025 Mis raices | Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
